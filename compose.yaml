name: zenda-assessment
services:
  db:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zenda}
      MYSQL_USER: ${MYSQL_USER:-zenda}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zenda_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-zenda}
      DB_USERNAME: ${MYSQL_USER:-zenda}
      DB_PASSWORD: ${MYSQL_PASSWORD:-zenda_local_only}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8081},http://127.0.0.1:${WEB_PORT:-8081}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/students"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  mysql_data:
